name: Community Android build
on:
  push:
    branches: [feature/scheduled-automation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and native regression tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-debug-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
