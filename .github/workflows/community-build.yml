name: Community Android build
on:
  push:
    branches: [main, feature/scheduled-automation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fonts for Chinese Canvas regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Verify preinstalled Android SDK packages
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build and native regression tests
        run: |
          chmod +x gradlew
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --continue assembleDebug testDebugUnitTest lintDebug 2>&1 | tee /tmp/community-gradle.log; then
              exit 0
            fi
            if ! rg -q 'status code 429|Too Many Requests|Read timed out|Connection reset' /tmp/community-gradle.log; then
              exit 1
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Verify APK contains the reviewed sources and license assets
        run: python3 tools/verify-apk.py --apk app/build/outputs/apk/debug/app-debug.apk --report app/build/reports/build-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-debug-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/build-manifest.json
