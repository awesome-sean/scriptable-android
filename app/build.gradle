plugins { id 'com.android.application' }

def signingFile = new File(System.getenv('SCRIPTABLE_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.android/scriptable-community/signing.properties")
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'dev.scriptable.android'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.scriptable.android.community'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.2.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (signingFile.exists()) {
        signingConfigs {
            release {
                storeFile file(signingValues['storeFile'])
                storeType 'PKCS12'
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2/'
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
